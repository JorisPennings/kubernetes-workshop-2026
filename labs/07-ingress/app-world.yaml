apiVersion: apps/v1
kind: Deployment
metadata:
  name: world-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: world-app
  template:
    metadata:
      labels:
        app: world-app
    spec:
      containers:
        - name: world
          image: hashicorp/http-echo:latest
          args:
            - "-text=Hello from /world!"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: world-service
spec:
  selector:
    app: world-app
  ports:
    - port: 5678
      targetPort: 5678
